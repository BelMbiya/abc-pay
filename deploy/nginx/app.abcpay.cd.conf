# /etc/nginx/sites-available/app.abcpay.cd
# Front Next.js (SSR) — reverse-proxy vers le process Node lancé par PM2 sur :3000.
# Le bloc HTTPS (listen 443 + redirection) sera AJOUTÉ automatiquement par Certbot.

server {
    listen 80;
    listen [::]:80;
    server_name app.abcpay.cd;

    client_max_body_size 12M;

    # Assets statiques de Next servis directement depuis le disque (cache long).
    location /_next/static/ {
        alias /var/www/abcpay/abc-pay-web/.next/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/app.abcpay.cd.access.log;
    error_log  /var/log/nginx/app.abcpay.cd.error.log;
}

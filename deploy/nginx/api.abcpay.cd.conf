# /etc/nginx/sites-available/api.abcpay.cd
# API Laravel (PHP-FPM). Remplace api.abcpay.cd par ton vrai sous-domaine.
# Le bloc HTTPS (listen 443 + redirection) sera AJOUTÉ automatiquement par Certbot.

server {
    listen 80;
    listen [::]:80;
    server_name api.abcpay.cd;

    root /var/www/abcpay/abc-pay-api/public;
    index index.php;

    # Taille max d'upload (reçus, imports Excel à venir).
    client_max_body_size 12M;

    # En-têtes de sécurité (l'API renvoie déjà les siens via SecurityHeaders,
    # ceux-ci couvrent les erreurs servies par Nginx).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Bloque l'accès aux fichiers cachés (.env, .git…) sauf ACME.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/api.abcpay.cd.access.log;
    error_log  /var/log/nginx/api.abcpay.cd.error.log;
}
